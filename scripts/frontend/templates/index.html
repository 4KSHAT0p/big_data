<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IoT Sensors — Gyro & Acceleration</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>IoT Sensor Visualizer</h1>
      <p>Showing Gyroscope and Acceleration (latest values).</p>

      <div class="charts">
        <div class="chart-card">
          <h2>Acceleration (x,y,z)</h2>
          <canvas id="accelChart"></canvas>
        </div>
        <div class="chart-card">
          <h2>Gyroscope (x,y,z)</h2>
          <canvas id="gyroChart"></canvas>
        </div>
      </div>

      <div class="controls">
        <label>Samples: <input id="samples" type="number" value="20" min="1" max="2000"></label>
        <button id="refresh">Refresh Now</button>
        <label>Auto-refresh: <input id="autorefresh" type="checkbox"></label>
      </div>
    </div>

    <script src="/static/js/app.js"></script>
  </body>
  </html>
